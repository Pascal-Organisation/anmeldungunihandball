## Org-wide security gates from Pascal-Organisation/security-pipeline.
## Public repo: the shared workflows force GitHub-hosted runners.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"   # weekly: full-history secret scan + fresh CVE data
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'schedule' || 'change' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  security:
    name: Security
    uses: Pascal-Organisation/security-pipeline/.github/workflows/ci.yml@38ca59d972fff0824aff06bb67be9a3c0a6af852 # v3.3.0
    # actions/security-events: SAST on public repos
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read # pull the private ci-toolbox (GitHub-hosted path)
    with:
      sast-languages: python,actions
