## Org-wide security gates from Pascal-Organisation/security-pipeline.
## Public repo: the shared workflows force GitHub-hosted runners.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"   # weekly: full-history secret scan + fresh CVE data
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    uses: Pascal-Organisation/security-pipeline/.github/workflows/ci.yml@76b2ac5b33fd44b617aa41bc6c8a0b9c279b64f2 # v1.1.0
    # actions/security-events: SAST on public repos
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      sast-languages: python,actions
