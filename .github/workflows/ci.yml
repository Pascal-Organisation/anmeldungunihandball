## Org-wide security gates from Pascal-Organisation/security-pipeline.
## Public repo: the shared workflows force GitHub-hosted runners.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"   # weekly: full-history secret scan + fresh CVE data
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    uses: Pascal-Organisation/security-pipeline/.github/workflows/ci.yml@81ae25c0aa85aa044384a505ebcdcf80027a09c5 # v3.0.2
    # actions/security-events: SAST on public repos
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read # pull the private ci-toolbox (GitHub-hosted path)
    with:
      sast-languages: python,actions
